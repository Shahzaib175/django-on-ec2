name: Deploy Django App to EC2

on:
  push:
    branches:
      - develop  # Trigger the workflow on push to 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: |
        docker build -t django-app .

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker Image to Docker Hub
      run: |
        docker tag django-app shahzaibmehmood/django-app:latest
        docker push shahzaibmehmood/django-app:latest

    - name: Deploy to EC2
  run: |
    ssh -o StrictHostKeyChecking=no ec2-user@your-ec2-ip << 'EOF'
      docker pull shahzaibmehmood/django-app:latest
      docker stop django-app || true
      docker rm django-app || true
      docker run -d --name django-app -p 8000:8000 shahzaibmehmood/django-app:latest

      # Wait a bit to make sure the container is up
      sleep 10

      # Run migration
      docker exec django-app python manage.py migrate
    EOF
