name: Deploy Django App to EC2

on:
  push:
    branches:
      - develop  # Trigger the workflow on push to 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: |
        docker build -t django-app .

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker Image to Docker Hub
      run: |
        docker tag django-app shahzaibmehmood/django-app:latest
        docker push shahzaibmehmood/django-app:latest

    - name: SSH into EC2 and pull new Docker image
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        port: 22
        script: |
          sudo docker pull shahzaibmehmood/django-app:latest
          sudo docker stop django-app || true
          sudo docker rm django-app || true
          sudo docker run -d --name django-app -p 3000:3000 shahzaibmehmood/django-app:latest
